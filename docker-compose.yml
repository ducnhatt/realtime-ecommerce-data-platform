name: ${COMPOSE_PROJECT_NAME:-realtime-ecommerce}

services:
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.2.0}
    hostname: kafka
    container_name: realtime-ecommerce-kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "10"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - ecommerce-net
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:-ghcr.io/coollabsio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a4938f37f1be1841b8e7b627ad0207b265345fd0d063e42d7410c78af0e63e68}
    hostname: minio
    container_name: realtime-ecommerce-minio
    profiles:
      - streaming
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MC_HOST_health: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin123}@localhost:9000
    volumes:
      - minio-data:/data
    networks:
      - ecommerce-net
    healthcheck:
      test:
        - CMD
        - /usr/bin/mc
        - ready
        - health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  minio-init:
    image: ${MINIO_IMAGE:-ghcr.io/coollabsio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a4938f37f1be1841b8e7b627ad0207b265345fd0d063e42d7410c78af0e63e68}
    container_name: realtime-ecommerce-minio-init
    profiles:
      - streaming
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/bronze &&
        mc mb --ignore-existing local/silver &&
        mc mb --ignore-existing local/dlq &&
        mc mb --ignore-existing local/checkpoints &&
        mc ls local
    networks:
      - ecommerce-net
    restart: "no"

  spark-master:
    image: ${SPARK_IMAGE:-spark:4.0.4-scala2.13-java17-python3-ubuntu}
    hostname: spark-master
    container_name: realtime-ecommerce-spark-master
    profiles:
      - streaming
    command:
      - /opt/spark/sbin/start-master.sh
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_INTERNAL_BROKER:-kafka:29092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-ecommerce_reviews}
      SOURCE_TIME_ZONE: ${SOURCE_TIME_ZONE:-Asia/Ho_Chi_Minh}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BRONZE_BUCKET: ${MINIO_BRONZE_BUCKET:-bronze}
      MINIO_SILVER_BUCKET: ${MINIO_SILVER_BUCKET:-silver}
      MINIO_DLQ_BUCKET: ${MINIO_DLQ_BUCKET:-dlq}
      MINIO_CHECKPOINT_BUCKET: ${MINIO_CHECKPOINT_BUCKET:-checkpoints}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-local-dev}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-ecom:rt:v1}
      REDIS_METRIC_TTL_SECONDS: ${REDIS_METRIC_TTL_SECONDS:-172800}
      REDIS_LATEST_LIMIT: ${REDIS_LATEST_LIMIT:-100}
      REDIS_STREAM_TRIGGER_INTERVAL: ${REDIS_STREAM_TRIGGER_INTERVAL:-25 seconds}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_HTTP_PORT: ${CLICKHOUSE_HTTP_PORT:-8123}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ecommerce}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-ecommerce-local-dev}
      CLICKHOUSE_STAGING_DATABASE: ${CLICKHOUSE_STAGING_DATABASE:-staging}
      CLICKHOUSE_STAGING_TABLE: ${CLICKHOUSE_STAGING_TABLE:-ecommerce_events_raw}
      CLICKHOUSE_STAGING_CHECKPOINT_PREFIX: ${CLICKHOUSE_STAGING_CHECKPOINT_PREFIX:-silver_to_clickhouse_staging_v1}
      CLICKHOUSE_STAGING_MAX_FILES_PER_TRIGGER: ${CLICKHOUSE_STAGING_MAX_FILES_PER_TRIGGER:-10}
      CLICKHOUSE_STAGING_OUTPUT_PARTITIONS: ${CLICKHOUSE_STAGING_OUTPUT_PARTITIONS:-2}
      CLICKHOUSE_CONTROL_DATABASE: ${CLICKHOUSE_CONTROL_DATABASE:-control}
      CLICKHOUSE_GOLD_DATABASE: ${CLICKHOUSE_GOLD_DATABASE:-gold}
      STREAM_TRIGGER_INTERVAL: ${STREAM_TRIGGER_INTERVAL:-25 seconds}
      STREAM_OUTPUT_PARTITIONS: ${STREAM_OUTPUT_PARTITIONS:-1}
      SILVER_OUTPUT_PARTITIONS: ${SILVER_OUTPUT_PARTITIONS:-1}
      SILVER_INCREMENTAL_PREFIX: ${SILVER_INCREMENTAL_PREFIX:-ecommerce_reviews_incremental_v1}
      SILVER_INCREMENTAL_CHECKPOINT_PREFIX: ${SILVER_INCREMENTAL_CHECKPOINT_PREFIX:-bronze_to_silver_incremental_v1}
      SILVER_MAX_FILES_PER_TRIGGER: ${SILVER_MAX_FILES_PER_TRIGGER:-10}
      SILVER_INCREMENTAL_OUTPUT_PARTITIONS: ${SILVER_INCREMENTAL_OUTPUT_PARTITIONS:-2}
      KAFKA_MAX_OFFSETS_PER_TRIGGER: ${KAFKA_MAX_OFFSETS_PER_TRIGGER:-10000}
      MONITORING_DIR: ${MONITORING_CONTAINER_DIR:-/opt/monitoring}
      BRONZE_MONITOR_FILE: ${BRONZE_MONITOR_FILE:-spark_bronze_monitor.jsonl}
      SILVER_MONITOR_FILE: /tmp/silver_stream_monitor_manual.jsonl
      PYTHONPATH: /opt/platform-src:/opt/spark-apps
      VALIDATION_SAMPLE_DIR: /opt/contract-samples
    ports:
      - "${SPARK_MASTER_HOST_PORT:-7077}:7077"
      - "${SPARK_MASTER_UI_HOST_PORT:-8080}:8080"
    volumes:
      - ./spark:/opt/spark-apps:ro
      - ./src:/opt/platform-src/src:ro
      - ./architecture/samples:/opt/contract-samples:ro
      - ${MONITORING_HOST_DIR:-./monitoring}:${MONITORING_CONTAINER_DIR:-/opt/monitoring}
    networks:
      - ecommerce-net
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8080', timeout=2)" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  spark-worker:
    image: ${SPARK_IMAGE:-spark:4.0.4-scala2.13-java17-python3-ubuntu}
    hostname: spark-worker
    container_name: realtime-ecommerce-spark-worker
    profiles:
      - streaming
    command:
      - /opt/spark/sbin/start-worker.sh
      - spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-4}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-6g}
      SPARK_WORKER_WEBUI_PORT: "8081"
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-local-dev}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_HTTP_PORT: ${CLICKHOUSE_HTTP_PORT:-8123}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ecommerce}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-ecommerce-local-dev}
      CLICKHOUSE_STAGING_DATABASE: ${CLICKHOUSE_STAGING_DATABASE:-staging}
      CLICKHOUSE_STAGING_TABLE: ${CLICKHOUSE_STAGING_TABLE:-ecommerce_events_raw}
      CLICKHOUSE_CONTROL_DATABASE: ${CLICKHOUSE_CONTROL_DATABASE:-control}
      CLICKHOUSE_GOLD_DATABASE: ${CLICKHOUSE_GOLD_DATABASE:-gold}
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "${SPARK_WORKER_UI_HOST_PORT:-8081}:8081"
    networks:
      - ecommerce-net
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8081', timeout=2)" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:8.10.2-alpine}
    hostname: redis
    container_name: realtime-ecommerce-redis
    profiles:
      - serving
    command:
      - /bin/sh
      - -c
      - >-
        exec redis-server
        --appendonly yes
        --appendfsync everysec
        --maxmemory "$${REDIS_MAXMEMORY}"
        --maxmemory-policy noeviction
        --requirepass "$${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-local-dev}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-256mb}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - ecommerce-net
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse:26.3.33.24}
    hostname: clickhouse
    container_name: realtime-ecommerce-clickhouse
    profiles:
      - warehouse
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ecommerce}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-ecommerce-local-dev}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_HOST_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_HOST_PORT:-9002}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    networks:
      - ecommerce-net
    healthcheck:
      test:
        - CMD-SHELL
        - clickhouse-client --user "$${CLICKHOUSE_USER}" --password "$${CLICKHOUSE_PASSWORD}" --query "SELECT 1" | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
      args:
        AIRFLOW_BASE_IMAGE: ${AIRFLOW_BASE_IMAGE:-apache/airflow:slim-3.3.2-python3.10}
        PYSPARK_VERSION: ${PYSPARK_VERSION:-4.0.4}
    image: ${AIRFLOW_RUNTIME_IMAGE:-realtime-ecommerce-airflow:3.3.2-spark4.0.4}
    hostname: airflow
    container_name: realtime-ecommerce-airflow
    profiles:
      - orchestration
    command:
      - standalone
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: ${AIRFLOW_PARALLELISM:-2}
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: ${AIRFLOW_MAX_ACTIVE_TASKS_PER_DAG:-1}
      AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_HTTP_PORT: ${CLICKHOUSE_HTTP_PORT:-8123}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ecommerce}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-ecommerce-local-dev}
      CLICKHOUSE_STAGING_DATABASE: ${CLICKHOUSE_STAGING_DATABASE:-staging}
      CLICKHOUSE_STAGING_TABLE: ${CLICKHOUSE_STAGING_TABLE:-ecommerce_events_raw}
      CLICKHOUSE_STAGING_CHECKPOINT_PREFIX: ${CLICKHOUSE_STAGING_CHECKPOINT_PREFIX:-silver_to_clickhouse_staging_v1}
      CLICKHOUSE_STAGING_MAX_FILES_PER_TRIGGER: ${CLICKHOUSE_STAGING_MAX_FILES_PER_TRIGGER:-10}
      CLICKHOUSE_STAGING_OUTPUT_PARTITIONS: ${CLICKHOUSE_STAGING_OUTPUT_PARTITIONS:-2}
      CLICKHOUSE_GOLD_DATABASE: ${CLICKHOUSE_GOLD_DATABASE:-gold}
      SOURCE_TIME_ZONE: ${SOURCE_TIME_ZONE:-Asia/Ho_Chi_Minh}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-ecommerce_reviews}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BRONZE_BUCKET: ${MINIO_BRONZE_BUCKET:-bronze}
      MINIO_SILVER_BUCKET: ${MINIO_SILVER_BUCKET:-silver}
      MINIO_CHECKPOINT_BUCKET: ${MINIO_CHECKPOINT_BUCKET:-checkpoints}
      SILVER_INCREMENTAL_PREFIX: ${SILVER_INCREMENTAL_PREFIX:-ecommerce_reviews_incremental_v1}
      SILVER_DATASET_PREFIX: ${SILVER_INCREMENTAL_PREFIX:-ecommerce_reviews_incremental_v1}
      SILVER_INCREMENTAL_CHECKPOINT_PREFIX: ${SILVER_INCREMENTAL_CHECKPOINT_PREFIX:-bronze_to_silver_incremental_v1}
      SILVER_MAX_FILES_PER_TRIGGER: ${SILVER_MAX_FILES_PER_TRIGGER:-10}
      SILVER_INCREMENTAL_OUTPUT_PARTITIONS: ${SILVER_INCREMENTAL_OUTPUT_PARTITIONS:-2}
      SPARK_MASTER_URL: ${SPARK_MASTER_URL:-spark://spark-master:7077}
      WAREHOUSE_DAG_SCHEDULE: "${WAREHOUSE_DAG_SCHEDULE:-*/30 * * * *}"
      MONITORING_DIR: ${MONITORING_CONTAINER_DIR:-/opt/monitoring}
      RAW_DATA_MONITOR_FILE: ${RAW_DATA_MONITOR_FILE:-raw_data_monitor.jsonl}
      BRONZE_MONITOR_FILE: ${BRONZE_MONITOR_FILE:-spark_bronze_monitor.jsonl}
      SILVER_MONITOR_FILE: ${SILVER_MONITOR_FILE:-silver_stream_monitor.jsonl}
      MONITORING_AGGREGATION_SCHEDULE: "${MONITORING_AGGREGATION_SCHEDULE:-*/5 * * * *}"
      SPARK_HADOOP_CLOUD_PACKAGE: ${SPARK_HADOOP_CLOUD_PACKAGE:-org.apache.spark:spark-hadoop-cloud_2.13:4.0.4}
      CLICKHOUSE_SPARK_PACKAGE: ${CLICKHOUSE_SPARK_PACKAGE:-com.clickhouse.spark:clickhouse-spark-runtime-4.0_2.13:0.10.0}
      CLICKHOUSE_JDBC_PACKAGE: ${CLICKHOUSE_JDBC_PACKAGE:-com.clickhouse:clickhouse-jdbc:0.9.5}
      DBT_CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      DBT_CLICKHOUSE_PORT: ${CLICKHOUSE_HTTP_PORT:-8123}
      DBT_TARGET: ${DBT_TARGET:-dev}
      DBT_CLICKHOUSE_DEV_SCHEMA: ${DBT_CLICKHOUSE_DEV_SCHEMA:-gold_dbt_dev}
      DBT_CLICKHOUSE_PROD_SCHEMA: ${DBT_CLICKHOUSE_PROD_SCHEMA:-gold}
      DBT_THREADS: ${DBT_THREADS:-2}
      DBT_LOG_PATH: /opt/airflow/dbt-logs
      DBT_TARGET_PATH: /opt/airflow/dbt-target
      PYTHONPATH: /opt/platform-src:/opt/spark-apps
    ports:
      - "127.0.0.1:${AIRFLOW_HOST_PORT:-8082}:8080"
    volumes:
      - airflow-data:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./spark:/opt/spark-apps:ro
      - ./src:/opt/platform-src/src:ro
      - ./dbt:/opt/dbt-project:ro
      - ./clickhouse:/opt/clickhouse:ro
      - ${MONITORING_HOST_DIR:-./monitoring}:${MONITORING_CONTAINER_DIR:-/opt/monitoring}
    networks:
      - ecommerce-net
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health', timeout=5)" >/dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

networks:
  ecommerce-net:
    name: ecommerce-net

volumes:
  kafka-data:
    name: realtime-ecommerce-kafka-data
  minio-data:
    name: realtime-ecommerce-minio-data
  redis-data:
    name: realtime-ecommerce-redis-data
  clickhouse-data:
    name: realtime-ecommerce-clickhouse-data
  airflow-data:
    name: realtime-ecommerce-airflow-data
